
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoGebra 嵌入（自建网站 + 本地 .ggb，解决手机留空）</title>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 12px; }

  /* 核心：解决手机底部留空 —— 用 aspect-ratio 替掉固定 450px */
  .ggb-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;        /* GeoGebra 画布接近 4:3，比 16:9 更贴合 */
    max-height: 80vh;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;           /* 裁掉溢出，避免"假留空" */
    background: #fff;
    margin: 12px 0;
  }
  .ggb-wrap > div,
  .ggb-wrap iframe {
    width: 100% !important;
    height: 100% !important;
    border: 0;
    display: block;
  }
  @supports not (aspect-ratio: 4 / 3) {   /* 旧浏览器兜底 */
    .ggb-wrap { height: 75vw; max-height: 500px; }
  }
</style>
</head>
<body>

<h2>GeoGebra 嵌入演示</h2>
<div class="ggb-wrap" id="ggb-app"></div>

<script>
  var GGB_FILE = 'yuan.ggb';   // ← 改成你自己的 .ggb 路径，须与页面同域

  var params = {
    "appName": "classic",
    "showToolBar": true,
    "showAlgebraInput": true,
    "showMenuBar": true,
    "enableRightClick": false,
    "useBrowserForJS": true,
    "borderColor": "#ddd",
    "appletOnLoad": function () { console.log('GeoGebra 加载完成'); }
  };
  if (typeof GGB_FILE !== 'undefined') params.filename = GGB_FILE;

  var applet = new GGBApplet(params, '5.0', 'ggb-app');
  window.addEventListener('load', function () { applet.inject('ggb-app'); });
</script>

</body>
</html>
