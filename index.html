<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoGebra 嵌入示例（解决手机留空）</title>

<!-- ① 引入 GeoGebra 官方 JS 库 -->
<script src="https://www.geogebra.org/apps/deployggb.js"></script>

<style>
/* ===== 核心：解决手机端底部留空的样式 ===== */
.ggb-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;      /* 锁定宽高比，自适应永不留空 */
  max-height: 70vh;          /* 防止横屏 / 平板过高 */
  margin: 0 auto;
}

/* 让 iframe 和 JS API 注入的容器都填满 .ggb-wrap */
.ggb-wrap iframe,
.ggb-wrap > div {
  width: 100% !important;
  height: 100% !important;
  border: 1px solid #ddd;
  border-radius: 8px;
}

/* 备选：媒体查询（兼容不支持 aspect-ratio 的老浏览器） */
@media (max-width: 640px) {
  .ggb-wrap { max-height: none; }
}
</style>
</head>
<body>

<h2>方案一：JS API 嵌入（推荐，最稳）</h2>
<div class="ggb-wrap" id="ggb-element-1"></div>

<script>
  var applet1 = new GGBApplet({
    "filename": "https://www.geogebra.org/material/file/yuan.ggb", // ← 改成你自己的 .ggb 地址
    "showToolBar": true,
    "showAlgebraInput": true,
    "showMenuBar": true
  }, true);
  window.addEventListener("load", function () {
    applet1.inject('ggb-element-1');
  });
</script>

<hr>

<h2>方案二：官方 iframe 嵌入（适合 CMS 禁用 script 时）</h2>
<!-- 先把 yuan.ggb 上传到 geogebra.org，分享拿到 material id 填入下方 -->
<div class="ggb-wrap">
  <iframe src="https://www.geogebra.org/material/iframe/id/YOUR_MATERIAL_ID"
          allowfullscreen></iframe>
</div>

</body>
</html>
