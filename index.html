<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGebra 离线应用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 桌面端：居中布局 */
        @media (min-width: 641px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .container {
                width: 100%;
                max-width: 820px;
                padding: 16px;
            }
        }

        /* 移动端：正常文档流，不居中、不拉伸 */
        @media (max-width: 640px) {
            body {
                padding-top: env(safe-area-inset-top, 8px);
                padding-bottom: env(safe-area-inset-bottom, 8px);
                padding-left: 8px;
                padding-right: 8px;
            }
            .container {
                width: 100%;
            }
        }

        #applet_container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }

        /* GeoGebra iframe 填满容器 */
        #applet_container iframe {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        /* 加载提示 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #888;
            font-size: 15px;
        }
        .loading::after {
            content: "…";
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ""; }
            25% { content: "."; }
            50% { content: ".."; }
            75% { content: "..."; }
            100% { content: ""; }
        }
