<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGebra 离线应用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 820px;
            padding: 16px;
        }
        #applet_container {
            width: 100%;
            height: 480px;             /* 从 600px 调整为 480px */
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }
        /* 加载提示 - 精简样式 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #888;
            font-size: 15px;
        }
        .loading::after {
            content: "…";
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ""; }
            25% { content: "."; }
            50% { content: ".."; }
            75% { content: "..."; }
            100% { content: ""; }
        }
        /* 移动端适配 */
        @media (max-width: 640px) {
            .container { padding: 8px; }
            #applet_container { height: 60vw; }   /* 从 75vw 调整为 60vw */
            border-radius: 8px;
        }
        @media (max-width: 420px) {
            #applet_container { height: 65vw; }   /* 从 80vw 调整为 65vw */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- GeoGebra 容器 -->
        <div id="applet_container">
            <div class="loading">加载中</div>
        </div>
    </div>

    <!-- ========== 核心加载脚本 ========== -->
    <!-- 1. 引入离线包中的 deployggb.js -->
    <script src="GeoGebra/deployggb.js"></script>

    <script>
        (function() {
            "use strict";

            // ----- 工具函数：获取 URL 参数 -----
            function getQueryParam(name) {
                var url = new URL(window.location.href);
                return url.searchParams.get(name);
            }

            // ----- 配置区（你可以在这里修改默认值）-----
            var DEFAULT_FILE_URL = "https://p.jgd.cc.cd/file/1784779273427_1.ggb";
            var GGB_BASE_PATH = "GeoGebra/HTML5/5.0/web3d/";

            // ----- 从 URL 获取文件名或完整 URL -----
            var fileParam = getQueryParam('file');
            var fileUrl = (fileParam && fileParam.trim() !== '') ? fileParam.trim() : DEFAULT_FILE_URL;

            // 防止路径遍历攻击
            if (!fileUrl.includes('://')) {
                if (fileUrl.includes('/') || fileUrl.includes('\\')) {
                    fileUrl = DEFAULT_FILE_URL;
                    console.warn('不合法的文件名，已使用默认文件');
                }
            }

            // ----- 配置 GeoGebra Applet -----
            var params = {
                "filename": fileUrl,
                "width": "100%",
                "height": 480,                    // 与 CSS 中的高度保持一致
                "appName": "classic",
                "showToolBar": false,
                "showMenuBar": false,
                "showAlgebraInput": false,
                "showResetIcon": true,
                "enableLabelDrags": false,
                "enableShiftDragZoom": true,
                "enableRightClick": false,
                "showLogging": false,
                "showTitleBar": false,
                "borderColor": "none",            // 去掉边框，更紧凑
                "errorHandler": function(msg) {
                    console.error('GeoGebra 加载错误:', msg);
                    var container = document.getElementById('applet_container');
                    if (container) {
                        container.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#c0392b;padding:20px;text-align:center;flex-direction:column;"><span style="font-size:48px;margin-bottom:12px;">⚠️</span><span>加载失败：' + msg + '</span><span style="font-size:13px;color:#888;margin-top:8px;">请检查文件地址是否正确或网络是否可用</span></div>';
                    }
                }
            };

            // ----- 创建并注入 Applet -----
            var applet = new GGBApplet(params, true);
            applet.setHTML5Codebase(GGB_BASE_PATH);

            function injectApplet() {
                var container = document.getElementById('applet_container');
                if (!container) return;
                container.innerHTML = '';
                try {
                    applet.inject('applet_container');
                } catch (e) {
                    console.error('注入 Applet 失败:', e);
                    container.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#c0392b;padding:20px;text-align:center;flex-direction:column;"><span style="font-size:48px;margin-bottom:12px;">❌</span><span>初始化失败，请刷新页面重试</span></div>';
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', injectApplet);
            } else {
                injectApplet();
            }

            // ----- 窗口自适应 -----
            var resizeTimer = null;
            window.addEventListener('resize', function() {
                if (resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    if (applet && typeof applet.resize === 'function') {
                        applet.resize();
                    }
                }, 200);
            });

        })();
    </script>

</body>
</html>
