<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoGebra 离线应用</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #f0f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  /* 桌面端居中，移动端正常文档流 */
  @media (min-width: 641px) {
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
  }
  .container {
    width: 100%; max-width: 820px; padding: 16px;
  }
  @media (max-width: 640px) {
    .container { padding: 8px; padding-top: env(safe-area-inset-top, 8px); }
  }
  /* 容器只负责占位高度，不参与 flex 拉伸 */
  #applet_container {
    width: 100%;
    height: 56.25vw;          /* 16:9，按宽度算高度，移动端稳定 */
    max-height: 70vh;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    overflow: hidden;
  }
  @media (min-width: 641px) {
    #applet_container { height: 461px; }   /* 820 * 9/16≈461 */
  }
  @media (max-width: 420px) {
    #applet_container { height: 125vw; max-height: 70vh; } /* 4:5 */
  }
  #applet_container iframe {
    display: block; width: 100% !important; height: 100% !important; border: none;
  }
  .loading {
    display: flex; justify-content: center; align-items: center;
    height: 100%; color: #888; font-size: 15px;
  }
  .loading::after { content: "…"; animation: dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""} }
</style>
</head>
<body>
<div class="container">
  <div id="applet_container"><div class="loading">加载中</div></div>
</div>

<script src="GeoGebra/deployggb.js"></script>
<script>
(function () {
  "use strict";

  function getQueryParam(n){ return new URL(location.href).searchParams.get(n); }

  var DEFAULT_FILE_URL = "https://p.jgd.cc.cd/file/1784779273427_1.ggb";
  var GGB_BASE_PATH = "GeoGebra/HTML5/5.0/web3d/";

  var f = getQueryParam('file');
  var fileUrl = (f && f.trim()) ? f.trim() : DEFAULT_FILE_URL;
  if (!fileUrl.includes('://') && (fileUrl.includes('/') || fileUrl.includes('\\'))) {
    fileUrl = DEFAULT_FILE_URL;
  }

  // 关键：width/height 用具体像素，不用 "100%"
  var params = {
    "filename": fileUrl,
    "width": 800,
    "height": 450,
    "appName": "classic",
    "showToolBar": false,
    "showMenuBar": false,
    "showAlgebraInput": false,
    "showResetIcon": true,
    "showFullscreenButton": true,
    "showZoomButtons": true,
    "enableLabelDrags": false,
    "enableShiftDragZoom": true,
    "enableRightClick": false,
    "showTitleBar": false,
    "borderColor": "none"
  };

  var applet = new GGBApplet(params, true);
  applet.setHTML5Codebase(GGB_BASE_PATH);

  function fitSize() {
    var box = document.getElementById('applet_container');
    if (!box || !applet || typeof applet.setSize !== 'function') return;
    var w = box.clientWidth, h = box.clientHeight;
    if (w > 0 && h > 0) applet.setSize(w, h);
  }

  function inject() {
    var box = document.getElementById('applet_container');
    box.innerHTML = '';
    applet.inject('applet_container');
    setTimeout(fitSize, 300);   // 等 iframe 起来后再对齐一次
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', inject);
  } else { inject(); }

  var t;
  window.addEventListener('resize', function(){
    clearTimeout(t); t = setTimeout(fitSize, 200);
  });
})();
</script>
</body>
</html>
