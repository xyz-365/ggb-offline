<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoGebra 离线应用</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #f0f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* 桌面端居中 */
  @media (min-width: 641px) {
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 820px; padding: 16px; }
    #applet_container { height: 461px; }
  }

  /* 移动端：纯文档流 */
  @media (max-width: 640px) {
    body {
      padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px);
    }
    .container { width: 100%; }
    #applet_container { height: 56.25vw; }  /* 16:9 */
  }

  /* 小屏竖屏 */
  @media (max-width: 420px) {
    #applet_container { height: 125vw; }    /* 4:5 */
  }

  /* ===== 容器本身 ===== */
  #applet_container {
    width: 100%;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    overflow: hidden;
    position: relative;
  }

  /* ===== 强制 GGB 所有内部层级填满 ===== */
  #applet_container > *,
  #applet_container iframe,
  #applet_container iframe html,
  #applet_container iframe body,
  #applet_container article,
  #applet_container .applet_scaler,
  #applet_container .GeoGebraFrame {
    width: 100% !important;
    height: 100% !important;
    max-height: 100% !important;
    display: block !important;
  }

  /* GGB 内部 canvas 也要填满 */
  #applet_container canvas {
    width: 100% !important;
    height: 100% !important;
  }

  .loading {
    display: flex; justify-content: center; align-items: center;
    height: 100%; color: #888; font-size: 15px;
  }
  .loading::after { content: "…"; animation: dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""} }
</style>
</head>
<body>
<div class="container">
  <div id="applet_container"><div class="loading">加载中</div></div>
</div>

<script src="GeoGebra/deployggb.js"></script>
<script>
(function () {
  "use strict";

  function getQueryParam(n){ return new URL(location.href).searchParams.get(n); }

  var DEFAULT_FILE_URL = "https://p.jgd.cc.cd/file/1784779273427_1.ggb";
  var GGB_BASE_PATH = "GeoGebra/HTML5/5.0/web3d/";

  var f = getQueryParam('file');
  var fileUrl = (f && f.trim()) ? f.trim() : DEFAULT_FILE_URL;
  if (!fileUrl.includes('://') && (fileUrl.includes('/') || fileUrl.includes('\\'))) {
    fileUrl = DEFAULT_FILE_URL;
  }

  // 用具体像素初始化（关键：不能 100%）
  var params = {
    "filename": fileUrl,
    "width": 800,
    "height": 450,
    "appName": "classic",
    "showToolBar": false,
    "showMenuBar": false,
    "showAlgebraInput": false,
    "showResetIcon": true,
    "showFullscreenButton": true,
    "showZoomButtons": true,
    "enableLabelDrags": false,
    "enableShiftDragZoom": true,
    "enableRightClick": false,
    "showTitleBar": false,
    "borderColor": "none"
  };

  var applet = new GGBApplet(params, true);
  applet.setHTML5Codebase(GGB_BASE_PATH);

  function getBoxSize() {
    var box = document.getElementById('applet_container');
    return { w: box.clientWidth, h: box.clientHeight };
  }

  function fitSize() {
    var size = getBoxSize();
    if (size.w > 0 && size.h > 0 && applet && typeof applet.setSize === 'function') {
      applet.setSize(size.w, size.h);
    }
  }

  function forceFill() {
    // 强制 GGB 内部所有层级高度 100%
    var box = document.getElementById('applet_container');
    var iframes = box.querySelectorAll('iframe');
    for (var i = 0; i < iframes.length; i++) {
      var doc = iframes[i].contentDocument || iframes[i].contentWindow && iframes[i].contentWindow.document;
      if (doc) {
        var style = doc.createElement('style');
        style.textContent = `
          html, body { width:100% !important; height:100% !important; margin:0 !important; padding:0 !important; overflow:hidden !important; }
          article, .applet_scaler, .GeoGebraFrame { width:100% !important; height:100% !important; max-height:100% !important; }
          canvas { width:100% !important; height:100% !important; }
        `;
        doc.head.appendChild(style);
      }
    }
  }

  function inject() {
    var box = document.getElementById('applet_container');
    box.innerHTML = '';
    applet.inject('applet_container');

    // 多次尝试 resize + 注入样式，因为 GGB 是异步加载的
    setTimeout(fitSize, 300);
    setTimeout(forceFill, 500);
    setTimeout(fitSize, 800);
    setTimeout(forceFill, 1000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', inject);
  } else { inject(); }

  var t;
  window.addEventListener('resize', function(){
    clearTimeout(t);
    t = setTimeout(function(){ fitSize(); forceFill(); }, 200);
  });
})();
</script>
</body>
</html>
